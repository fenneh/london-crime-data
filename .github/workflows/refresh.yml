name: Refresh data

on:
  schedule:
    - cron: "0 6 6 * *"  # 6th of each month at 06:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: "Source key to refresh (leave blank for all)"
        required: false
        default: ""

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Refresh datasets
        env:
          INPUT_SOURCE: ${{ github.event.inputs.source }}
        run: |
          if [ -n "$INPUT_SOURCE" ]; then
            uv run scripts/refresh.py --source "$INPUT_SOURCE"
          else
            uv run scripts/refresh.py
          fi

      - name: Build site
        run: uv run scripts/build_site.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/ london_crime/_sources.py
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: refresh $(date +'%Y-%m')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt, retrying..."
            sleep 5
          done
          echo "Push failed after 5 attempts."
          exit 1
